<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibecoding 资源目录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="header">
    <h1 class="header__title">🪐 Vibecoding 资源目录</h1>
    <p class="header__subtitle">多维度记录与发现 vibecoding 工具、资源和实践 · <a href="stats.html" style="color:var(--accent,#6366f1);">📊 统计面板</a></p>
    <div class="header__search">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="🔍 搜索条目名称、描述或标签..."
        autocomplete="off"
      >
    </div>
  </header>

  <nav id="categoryNav" class="category-nav" aria-label="分类导航"></nav>

  <main id="mainContent" class="main-content">
    <div class="loading" id="loadingState">
      <p>加载中...</p>
    </div>
    <div class="error" id="errorState" hidden>
      <p>⚠️ 无法加载数据，请确认 <code>data/catalog.json</code> 文件存在且格式正确。</p>
    </div>
  </main>

  <footer class="footer">
    <!-- Token 配置 -->
    <div class="settings-row" id="settingsRow">
      <span class="settings-row__label">🔑 Token</span>
      <input type="password" id="githubToken" class="settings-row__input"
             placeholder="ghp_... 或 github_pat_...（仅存本地浏览器）">
      <button class="settings-row__btn settings-row__btn--save" id="saveTokenBtn">💾 保存</button>
      <button class="settings-row__btn settings-row__btn--clear" id="clearTokenBtn" hidden>清除</button>
      <span style="font-size:0.7rem;color:var(--text-muted);white-space:nowrap;" id="tokenStatus">⚪ 未配置</span>
    </div>

    <details class="add-entry" id="addEntrySection">
      <summary class="add-entry__summary">📥 添加 / 编辑条目</summary>
      <div class="add-entry__body">
        <p class="add-entry__hint">
          填写后点"保存"，直接通过 GitHub API 提交到
          <code>data/catalog.json</code>，几秒后自动部署。
        </p>
        <p class="entry-form__mode-row">
          <span class="entry-form__mode-indicator entry-form__mode-indicator--add" id="formMode">➕ 新增模式</span>
        </p>
        <form id="entryForm" class="entry-form" autocomplete="off">
          <div class="entry-form__row">
            <label class="entry-form__label">
              分类
              <select id="formCategory" class="entry-form__select" required>
                <option value="">-- 选择分类 --</option>
              </select>
            </label>
            <label class="entry-form__label">
              名称
              <input type="text" id="formName" class="entry-form__input" placeholder="条目名称" required>
            </label>
          </div>
          <div class="entry-form__row">
            <label class="entry-form__label entry-form__label--wide">
              描述
              <input type="text" id="formDesc" class="entry-form__input" placeholder="1-2 句话描述它的用途和为什么好用" required>
            </label>
          </div>
          <div class="entry-form__row">
            <label class="entry-form__label">
              URL（可选）
              <input type="url" id="formUrl" class="entry-form__input" placeholder="https://...">
            </label>
            <label class="entry-form__label">
              标签（可选，逗号分隔）
              <input type="text" id="formTags" class="entry-form__input" placeholder="claude, code-generation">
            </label>
          </div>
          <div style="display:flex;gap:0.5rem;align-items:center;">
            <button type="submit" class="entry-form__btn" id="submitBtn">💾 保存到 GitHub</button>
            <button type="button" class="entry-form__cancel-btn" id="cancelEditBtn" hidden>取消编辑</button>
            <span style="font-size:0.75rem;color:var(--text-muted);" id="saveHint"></span>
          </div>
        </form>
        <p class="add-entry__steps">
          💡 需要先在顶部配置 GitHub Token 才能直接保存。
        </p>
      </div>
    </details>
    <p class="footer__meta">
      最后更新：<span id="lastUpdated">--</span>
    </p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
